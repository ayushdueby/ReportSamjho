server.port=${PORT:5001}

# Groq API
groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model.text=llama-3.1-8b-instant
groq.model.vision=llama-3.2-11b-vision-preview

# Razorpay
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:placeholder_secret}
razorpay.amount.paise=9900

# CORS — comma-separated list of allowed origins
cors.allowed.origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.reportsamjho=INFO

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev    # production uses Dockerfile (multi-stage)
    ports:
      - "5001:5001"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - ALLOWED_ORIGINS=http://localhost:3000
    volumes:
      - ./backend/src:/app/src
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5001
      - WDS_SOCKET_PORT=0
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend
    stdin_open: true
